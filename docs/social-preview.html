<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=1280">
  <title>Little Lemon — Social preview</title>
  <!-- Render this 1280 × 640 composition with local assets and fonts loaded.
       Screenshots are the original captures; their system bars are preserved. -->
  <style>
    @font-face {
      font-family: "Markazi";
      font-weight: 500;
      src: url("../assets/fonts/MarkaziText-Medium.ttf") format("truetype");
    }
    @font-face {
      font-family: "Karla";
      font-weight: 400;
      src: url("../assets/fonts/Karla-Regular.ttf") format("truetype");
    }
    @font-face {
      font-family: "Karla";
      font-weight: 500;
      src: url("../assets/fonts/Karla-Medium.ttf") format("truetype");
    }
    @font-face {
      font-family: "Karla";
      font-weight: 700;
      src: url("../assets/fonts/Karla-Bold.ttf") format("truetype");
    }

    :root {
      --green: #495e57;
      --yellow: #f4ce14;
      --peach: #fbdabb;
      --light: #edefee;
      --dark: #333333;
      --white: #ffffff;
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; width: 1280px; height: 640px; overflow: hidden; }

    body {
      position: relative;
      isolation: isolate;
      color: var(--light);
      font-family: "Karla", sans-serif;
      background: var(--green);
    }

    .lighting {
      position: absolute;
      inset: 0;
      z-index: -2;
      background:
        radial-gradient(ellipse at 73% 41%, rgba(251, 218, 187, .16), transparent 48%),
        radial-gradient(ellipse at 5% 2%, rgba(237, 239, 238, .06), transparent 50%),
        linear-gradient(110deg, rgba(0, 0, 0, .43), rgba(0, 0, 0, .04) 72%, rgba(0, 0, 0, .22));
    }

    /* An oversized lemon outline supplies a quiet brand motif behind the phones. */
    .lemon-outline {
      position: absolute;
      width: 634px;
      height: 730px;
      right: -18px;
      top: -63px;
      z-index: -1;
      color: var(--peach);
      opacity: .1;
      transform: rotate(14deg);
    }

    .brand {
      position: absolute;
      left: 68px;
      top: 54px;
      width: 176px;
      height: auto;
    }

    .eyebrow {
      position: absolute;
      top: 151px;
      left: 70px;
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 0;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 2.4px;
      text-transform: uppercase;
      color: rgba(237, 239, 238, .72);
    }

    .eyebrow::before {
      content: "";
      width: 26px;
      height: 2px;
      background: var(--yellow);
    }

    h1 {
      position: absolute;
      top: 194px;
      left: 64px;
      margin: 0;
      font-family: "Markazi", Georgia, serif;
      font-size: 152px;
      line-height: .68;
      font-weight: 500;
      letter-spacing: -2.6px;
      color: var(--yellow);
    }

    h1 span { display: block; }

    .lead {
      position: absolute;
      top: 434px;
      left: 70px;
      margin: 0;
      font-size: 24px;
      line-height: 1.35;
      font-weight: 500;
      letter-spacing: -.3px;
    }

    .description {
      position: absolute;
      top: 477px;
      left: 70px;
      width: 400px;
      margin: 0;
      font-size: 17px;
      line-height: 1.5;
      color: rgba(237, 239, 238, .68);
    }

    .technology {
      position: absolute;
      left: 70px;
      bottom: 44px;
      display: flex;
      align-items: center;
      gap: 16px;
      padding-top: 18px;
      border-top: 1px solid rgba(237, 239, 238, .14);
      width: 440px;
      font-size: 13px;
      font-weight: 500;
      color: rgba(237, 239, 238, .7);
    }

    .technology span + span::before {
      content: "·";
      display: inline-block;
      margin-right: 16px;
      color: rgba(244, 206, 20, .65);
    }

    .stage-shadow {
      position: absolute;
      left: 625px;
      top: 553px;
      width: 595px;
      height: 74px;
      background: radial-gradient(ellipse, rgba(0, 0, 0, .43), transparent 70%);
      filter: blur(12px);
    }

    /* All phone dimensions scale together. No additional system bars or earpiece. */
    .phone {
      --frame: calc(var(--width) * .010);
      --bezel: calc(var(--width) * .011);
      --radius: calc(var(--width) * .080);
      position: absolute;
      width: var(--width);
      padding: var(--frame);
      border-radius: var(--radius);
      background: linear-gradient(
        120deg,
        #8b9390 0%, #444b49 14%, #151b19 32%,
        #343c39 64%, #a4aaa6 85%, #464d49 93%, #202724 100%
      );
      box-shadow:
        inset 0 0 0 .7px rgba(237, 239, 238, .3),
        0 2px 3px rgba(0, 0, 0, .45),
        9px 18px 20px rgba(0, 0, 0, .28),
        15px 36px 44px rgba(0, 0, 0, .3);
    }

    .bezel {
      padding: var(--bezel);
      border-radius: calc(var(--radius) - var(--frame));
      background: #060907;
      box-shadow: inset 0 0 0 .5px rgba(237, 239, 238, .15);
    }

    .screen {
      position: relative;
      width: 100%;
      aspect-ratio: 1080 / 2400;
      overflow: hidden;
      border-radius: calc(var(--radius) - var(--frame) - var(--bezel));
      background: var(--white);
    }

    .screen > img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .camera {
      position: absolute;
      top: calc(var(--width) * .014);
      left: 50%;
      width: calc(var(--width) * .022);
      aspect-ratio: 1;
      transform: translateX(-50%);
      border: .8px solid #080c0b;
      border-radius: 50%;
      background: radial-gradient(circle at 38% 34%, #293844, #0d1417 35%, #010302 70%);
      box-shadow: 0 0 0 .45px rgba(0, 0, 0, .6);
    }

    .screen::after {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      border-radius: inherit;
      box-shadow: inset 0 0 0 .5px rgba(0, 0, 0, .13);
      background: linear-gradient(115deg, rgba(255, 255, 255, .025), transparent 36%);
    }

    .button {
      position: absolute;
      right: -1.5px;
      width: 2px;
      border-radius: 0 2px 2px 0;
      background: linear-gradient(90deg, #181e1b, #87918c);
      box-shadow: 1px 0 1px rgba(0, 0, 0, .55);
    }

    .volume { top: 20%; height: 9%; }
    .power { top: 32%; height: 6%; }

    .onboarding {
      --width: 208px;
      left: 612px;
      top: 96px;
      transform: rotate(-8deg);
      z-index: 1;
    }

    .profile {
      --width: 208px;
      left: 1002px;
      top: 107px;
      transform: rotate(8deg);
      z-index: 2;
    }

    .home {
      --width: 252px;
      left: 789px;
      top: 48px;
      transform: rotate(-2deg);
      z-index: 3;
      box-shadow:
        inset 0 0 0 .7px rgba(237, 239, 238, .35),
        0 2px 3px rgba(0, 0, 0, .5),
        8px 14px 20px rgba(0, 0, 0, .38),
        18px 32px 40px rgba(0, 0, 0, .4);
    }
  </style>
</head>
<body>
  <div class="lighting" aria-hidden="true"></div>
  <svg class="lemon-outline" viewBox="0 0 600 720" fill="none" aria-hidden="true">
    <path d="M296 24C329 43 353 50 393 60C548 98 604 250 552 399C510 521 410 637 291 674C259 684 242 688 224 710C207 685 190 677 166 661C50 589 15 431 57 287C88 180 158 94 238 64C270 52 283 44 296 24Z"
      stroke="currentColor" stroke-width="1.4"/>
    <path d="M291 674C438 589 550 396 517 237C498 143 420 80 296 24"
      stroke="currentColor" stroke-width=".8"/>
  </svg>

  <img class="brand" src="../assets/images/logo-light.png" alt="Little Lemon">
  <p class="eyebrow">Mediterranean roots. Chicago soul.</p>
  <h1><span>Little</span><span>Lemon.</span></h1>
  <p class="lead">A little taste of Chicago, on the go.</p>
  <p class="description">Browse the menu, even offline.<br>Find your favorites. Make it yours.</p>
  <div class="technology" aria-label="Built with React Native, Expo SDK 57, TypeScript and SQLite">
    <span>React Native</span><span>Expo SDK 57</span><span>TypeScript</span><span>SQLite</span>
  </div>

  <div class="stage-shadow" aria-hidden="true"></div>

  <div class="phone onboarding">
    <span class="button volume"></span><span class="button power"></span>
    <div class="bezel"><div class="screen">
      <img src="screenshots/onboarding.png" alt="Little Lemon onboarding screen">
      <span class="camera" aria-hidden="true"></span>
    </div></div>
  </div>

  <div class="phone profile">
    <span class="button volume"></span><span class="button power"></span>
    <div class="bezel"><div class="screen">
      <img src="screenshots/profile.png" alt="Little Lemon profile screen">
      <span class="camera" aria-hidden="true"></span>
    </div></div>
  </div>

  <div class="phone home">
    <span class="button volume"></span><span class="button power"></span>
    <div class="bezel"><div class="screen">
      <img src="screenshots/home.png" alt="Little Lemon menu with search and category filters">
      <span class="camera" aria-hidden="true"></span>
    </div></div>
  </div>
</body>
</html>
